name: Audit Suite v1.6
on:
  push:
    branches: [main]
    paths: ['audit-suite-v16/**', '.github/workflows/audit-suite-v16.yml']
  pull_request:
    paths: ['audit-suite-v16/**', '.github/workflows/audit-suite-v16.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Audit Suite Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: audit-suite-v16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install openpyxl==3.1.5 defusedxml==0.7.1
      - name: Unit tests
        run: python -X utf8 -B -m unittest discover -v
      - name: Headless integration
        run: python -X utf8 -B tools/verify_headless_v16.py --output-dir 검증/CI통합
