name: JS Audit Suite v2.5.0
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Audit v2.5 Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install openpyxl==3.1.5 defusedxml==0.7.1
      - name: Prepare test scratch folder
        run: New-Item -ItemType Directory -Force 검증
      - name: Unit tests
        run: python -B -X utf8 -m unittest discover -v
      - name: Release policy mock tests
        run: |
          python -B -X utf8 tools/test_release_v25.py
          python -B -X utf8 tools/test_release_v25_publish.py
      - name: Headless integration
        run: python -B -X utf8 tools/verify_headless_v25.py --directory "${{ runner.temp }}/audit-suite-v25-${{ matrix.python-version }}"
